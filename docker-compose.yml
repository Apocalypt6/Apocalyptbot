#   cp .env.example .env
#   docker compose up -d --build
services:
  apocalyptbot:
    build: .
    image: apocalyptbot:latest
    container_name: apocalyptbot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
      - ./data:/app/data
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
