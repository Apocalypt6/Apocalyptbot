[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apocalyptbot"
version = "0.2.0"
description = "Polymarket CLOB hunter: scan books, hunt completeness, paper-trade. Live is opt-in."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
live = ["py-clob-client-v2"]
dev = ["pytest>=7"]

[project.scripts]
apocalyptbot = "apocalyptbot.cli:main"

[tool.setuptools.packages.find]
include = ["apocalyptbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
