[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apocalyptbot"
version = "0.1.0"
description = "A small, honest crypto paper-trading and backtesting bot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
apocalyptbot = "apocalyptbot.cli:main"

[tool.setuptools.packages.find]
include = ["apocalyptbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
